<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacilos Beauty | Agenda tu Cita</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="animated-bg">
    <div class="ambient-light"></div>
    
    <header class="glass-header">
        <h1>Bacilos Beauty ✨</h1>
        <p>Reserva tu momento de elegancia</p>
    </header>

    <main class="container">
        
        <section class="services-gallery">
            <div class="service-item" onclick="selectService('Cejas y Pestañas')">
                <div class="img-wrapper">
                    <img src="https://cdn.phototourl.com/free/2026-06-04-ef484852-a5c2-4cb3-b8f1-361a1a727045.jpg">
                </div>
                <span>Cejas</span>
            </div>
            <div class="service-item" onclick="selectService('Cejas y Pestañas')">
            </div>
            <div class="service-item" onclick="selectService('Uñas - Acrílicas')">
                <div class="img-wrapper">
                    <img src="https://cdn.phototourl.com/free/2026-06-04-ec4b3386-59ed-4482-aee5-77aedb26c30f.jpg">
                </div>
                <span>Manos</span>
            </div>
            <div class="service-item" onclick="selectService('Uñas - Semi-permanente')">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059e98b?w=300&h=300&fit=crop" alt="Uñas Pies">
                </div>
                <span>Pies</span>
            </div>
        </section>

        <form id="booking-form" class="glass-card">
            <h2>Agendar Cita</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Maria Perez">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="telefono" required placeholder="+58 412 1234567">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fecha">Fecha deseada:</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="hora">Hora:</label>
                    <input type="time" id="hora" required>
                </div>
            </div>

            <div class="form-group">
                <label for="servicio">Servicio Principal:</label>
                <select id="servicio" required>
                    <option value="" disabled selected>Selecciona un servicio o toca una imagen arriba...</option>
                    <option value="Uñas - Acrílicas">Uñas - Acrílicas</option>
                    <option value="Uñas - Semi-permanente">Uñas - Semi-permanente</option>
                    <option value="Cejas y Pestañas">Cejas y Pestañas</option>
                    <option value="Cabello - Secado/Planchado">Cabello - Secado/Planchado</option>
                </select>
            </div>

            <div class="form-group" id="design-section">
                <label for="detalles">¿Algún diseño o idea en mente? (Opcional):</label>
                <textarea id="detalles" rows="3" placeholder="Ej. Francesas con pedrería, efecto espejo..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="glow-btn">Confirmar Cita</button>
            <p id="status-msg"></p>
        </form>
    </main>

    <script src="js/main.js"></script>
    <script>
        // Script adicional para UX Senior: Seleccionar servicio al tocar imagen
        function selectService(serviceValue) {
            const selectElement = document.getElementById('servicio');
            selectElement.value = serviceValue;
            
            // Animación suave de scroll hacia el formulario
            document.getElementById('booking-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Efecto visual en el select para indicar que cambió
            selectElement.style.boxShadow = "0 0 15px var(--primary-color)";
            setTimeout(() => {
                selectElement.style.boxShadow = "none";
            }, 1000);
        }
    </script>
</body>
</html>
